{% extends 'base.html' %}

{% block content %}

<div class="card shadow">

<div class="card-header bg-warning">

<h4>Edit Student</h4>

</div>

<div class="card-body">

<form method="POST">

<input class="form-control mb-3"
name="roll"
value="{{ s.roll }}">

<input class="form-control mb-3"
name="name"
value="{{ s.name }}">

<input class="form-control mb-3"
name="email"
value="{{ s.email }}">

<input class="form-control mb-3"
name="dept"
value="{{ s.dept }}">

<button class="btn btn-primary">

Update Student

</button>

</form>

</div>

</div>

{% endblock %}
